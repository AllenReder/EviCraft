plugins {
    id 'api-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Pure descriptors preserve IToolSpec without shipping AI providers.
    api project(':tool-contracts')

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.5.3'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

// Server-safety gate: the main source set must not reference Minecraft client classes. Source-set isolation
// already rejects our own client classes (they are not on the classpath), but not vanilla ones: common
// compiles against the merged client jar, so net.minecraft.client is always present. This check fails the
// build on any such reference; that code belongs in src/client/java.
tasks.register('checkServerSafe') {
    group = 'verification'
    description = 'Fail if src/main references Minecraft client-only classes.'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    outputs.upToDateWhen { false }
    doLast {
        def offenders = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            int no = 0
            f.eachLine('UTF-8') { line ->
                no++
                if (line.contains('net.minecraft.client') || line.contains('com.mojang.blaze3d')) {
                    offenders << "${f}:${no}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "src/main references Minecraft client classes (absent on a dedicated server; causes ClassNotFound).\n"
                    + "Move this code into src/client/java:\n  " + offenders.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn 'checkServerSafe' }
