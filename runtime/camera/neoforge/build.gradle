plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// Client-only camera mod. It never runs inside the dedicated server and shares no code with the Runtime.
ext.mod_id = 'mc_agent_camera'
base { archivesName = "${mod_id}-${minecraft_version}" }

java { toolchain.languageVersion = JavaLanguageVersion.of(java_version) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

repositories { mavenCentral() }

neoForge {
    version = neoforge_version
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
    runs {
        client {
            client()
            gameDirectory = file(providers.gradleProperty('cameraGameDir')
                    .orElse(file('runs/client').absolutePath).get())
        }
    }
}

processResources {
    def properties = [version: version, mod_id: mod_id, neoforge_version: neoforge_version,
                      neoforge_loader_version_range: neoforge_loader_version_range,
                      minecraft_version_range: minecraft_version_range]
    inputs.properties properties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand properties }
}

// Same standalone launch export as :core:neoforge:exportServerLaunch, for the camera client.
tasks.register('exportClientLaunch') {
    dependsOn tasks.named('createClientLaunchScript')
    def destination = providers.gradleProperty('clientLaunchOutput')
            .orElse(layout.buildDirectory.file('moddev/clientLaunch.json').map { it.asFile.absolutePath })
    outputs.file(destination)
    outputs.upToDateWhen { false }
    doLast {
        def launch = tasks.named('createClientLaunchScript').get()
        def run = tasks.named('runClient').get()
        def descriptor = [
                javaExecutable: launch.javaExecutable.get(),
                classpathArgsFile: launch.classpathArgsFile.get().asFile.absolutePath,
                vmArgsFile: launch.vmArgsFile.get(),
                programArgsFile: launch.programArgsFile.get(),
                jvmArguments: run.allJvmArgs,
                mainClass: run.mainClass.get(),
                environment: launch.environment.get(),
        ]
        def output = file(destination.get())
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(descriptor)) + '\n'
    }
}
